<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Test vocacional · Carreras UNNE y UTN FRRe</title>
<style>
  :root {
    --violeta: #7c6cf0;
    --violeta-oscuro: #5b4bd6;
    --azul: #4f8cff;
    --verde: #3ecf9b;
    --texto: #2b2745;
    --texto-suave: #6b6788;
    --borde: #e3dffa;
    --tarjeta: #ffffff;
    --sombra: 0 10px 30px rgba(91, 75, 214, .12);
    --radio: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--texto);
    line-height: 1.5;
    min-height: 100vh;
    background: linear-gradient(135deg, #f1eeff, #e6f1ff 55%, #e4f8ef);
    background-attachment: fixed;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
  }
  .app { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 16px; }

  /* Progreso */
  .topbar { display: none; }
  .topbar.visible { display: block; }
  .progreso-info { display: flex; justify-content: space-between; gap: 10px; font-size: .85rem; color: var(--texto-suave); margin-bottom: 8px; font-weight: 600; }
  .barra { height: 10px; background: rgba(124,108,240,.15); border-radius: 99px; overflow: hidden; }
  .barra > div {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--violeta), var(--azul), var(--verde));
    border-radius: 99px;
    transition: width .4s cubic-bezier(.4,0,.2,1);
  }

  /* Tarjeta */
  .tarjeta {
    background: var(--tarjeta);
    border-radius: var(--radio);
    box-shadow: var(--sombra);
    padding: 28px 22px;
    border: 1px solid var(--borde);
  }
  .pantalla { animation: entrar .35s ease both; }
  .pantalla.atras { animation-name: entrarAtras; }
  .pantalla.saliendo { animation: salir .18s ease both; }
  @keyframes entrar { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: none; } }
  @keyframes entrarAtras { from { opacity: 0; transform: translateX(-26px); } to { opacity: 1; transform: none; } }
  @keyframes salir { to { opacity: 0; transform: translateX(-18px); } }

  /* Bienvenida */
  .bienvenida { text-align: center; padding: 8px 0; }
  h1 { font-size: clamp(1.6rem, 5.5vw, 2.2rem); line-height: 1.2; margin: 4px 0 12px; color: var(--violeta-oscuro); }
  .bienvenida p { color: var(--texto-suave); font-size: 1.05rem; max-width: 560px; margin: 0 auto 14px; }
  .como { text-align: left; background: #f6f4ff; border-radius: 14px; padding: 14px 18px; max-width: 560px; margin: 0 auto 18px; font-size: .95rem; color: var(--texto); }
  .como strong { color: var(--violeta-oscuro); }
  .como ul, .como ol { margin: 6px 0 0 20px; }
  .como li { margin-bottom: 3px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 22px; }
  .chip { background: #f3f1ff; color: var(--violeta-oscuro); border-radius: 99px; padding: 6px 14px; font-size: .85rem; font-weight: 600; }

  .btn {
    appearance: none; border: 0; cursor: pointer;
    font: inherit; font-weight: 700; font-size: 1.05rem;
    padding: 14px 28px; border-radius: 99px;
    color: #fff;
    background: linear-gradient(135deg, var(--violeta), var(--azul));
    box-shadow: 0 8px 20px rgba(91,75,214,.3);
    transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(91,75,214,.35); }
  .btn:active { transform: translateY(0); }
  .btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn.secundario { background: #fff; color: var(--violeta-oscuro); border: 2px solid var(--borde); box-shadow: none; }
  .btn.secundario:hover { border-color: var(--violeta); }
  .btn:focus-visible, .nivel:focus-visible, summary:focus-visible, .volver:focus-visible, .filtro:focus-visible, .area-op:focus-visible { outline: 3px solid var(--azul); outline-offset: 3px; }

  /* Pregunta con escala */
  .seccion { display: inline-block; font-size: .78rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--violeta-oscuro); background: #f0edff; padding: 4px 12px; border-radius: 99px; margin-bottom: 14px; }
  h2 { font-size: clamp(1.2rem, 4.6vw, 1.55rem); line-height: 1.35; margin-bottom: 22px; font-weight: 650; }
  .escala { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .nivel {
    appearance: none; cursor: pointer; font: inherit; color: inherit;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px;
    background: #faf9ff; border: 2px solid var(--borde); border-radius: 14px;
    padding: 12px 4px 10px; min-height: 84px;
    transition: transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .nivel .num { font-size: 1.4rem; font-weight: 800; color: var(--violeta-oscuro); line-height: 1; }
  .nivel .etq { font-size: .72rem; line-height: 1.2; color: var(--texto-suave); font-weight: 600; text-align: center; }
  .nivel:hover { border-color: var(--violeta); background: #f3f1ff; transform: translateY(-2px); }
  .nivel.elegida { border-color: var(--violeta-oscuro); background: var(--violeta-oscuro); box-shadow: 0 6px 16px rgba(91,75,214,.3); }
  .nivel.elegida .num, .nivel.elegida .etq { color: #fff; }
  .nav-pregunta { margin-top: 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .volver { background: none; border: 0; font: inherit; font-weight: 600; color: var(--texto-suave); cursor: pointer; padding: 8px 4px; border-radius: 8px; }
  .volver:hover { color: var(--violeta-oscuro); }
  .volver[disabled] { visibility: hidden; }
  .ayuda-teclas { font-size: .78rem; color: var(--texto-suave); display: none; }
  @media (hover: hover) and (pointer: fine) { .ayuda-teclas { display: block; } }

  /* Pantalla de áreas (transición) */
  .area-lista { display: grid; gap: 10px; margin: 6px 0 18px; }
  .area-fija, .area-op {
    text-align: left; width: 100%; font: inherit; color: inherit;
    border: 2px solid var(--borde); border-radius: 14px; background: #faf9ff; padding: 12px 14px;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .area-fija { border-left: 6px solid var(--verde); }
  .area-fija .rot { font-size: .75rem; font-weight: 700; color: #1d8a63; background: #e4f8ef; padding: 2px 10px; border-radius: 99px; white-space: nowrap; }
  .area-op { cursor: pointer; transition: border-color .15s ease, background .15s ease; }
  .area-op:hover { border-color: var(--violeta); }
  .area-op.sel { border-color: var(--violeta-oscuro); background: #efecff; }
  .area-op .tilde { font-size: .75rem; font-weight: 700; color: var(--texto-suave); white-space: nowrap; }
  .area-op.sel .tilde { color: var(--violeta-oscuro); }
  .aviso-empate { background: #fff7e6; border: 1px solid #ffe1a8; color: #7a5a12; border-radius: 12px; padding: 12px 14px; font-size: .92rem; margin: 6px 0 12px; }
  .pantalla-areas p.sub { margin-bottom: 14px; }

  /* Resultado */
  .resultado-cabecera { text-align: center; padding: 6px 0 18px; }
  .resultado-cabecera .etiqueta { font-size: .82rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--texto-suave); }
  .resultado-cabecera h2 { margin: 8px 0; font-size: clamp(1.5rem, 6vw, 2rem); color: var(--violeta-oscuro); }
  .resultado-cabecera .lema { font-weight: 600; margin-bottom: 10px; }
  .resultado-cabecera .mensaje { color: var(--texto-suave); max-width: 600px; margin: 0 auto; }
  h3 { font-size: 1.12rem; margin: 26px 0 6px; }
  .sub { font-size: .9rem; color: var(--texto-suave); margin-bottom: 12px; }
  .filtros { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 2px; }
  .filtro { appearance: none; cursor: pointer; font: inherit; font-size: .85rem; font-weight: 700; padding: 8px 14px; border-radius: 99px; border: 2px solid var(--borde); background: #fff; color: var(--texto-suave); transition: all .15s ease; }
  .filtro:hover { border-color: var(--violeta); color: var(--violeta-oscuro); }
  .filtro.activo { background: var(--violeta-oscuro); border-color: var(--violeta-oscuro); color: #fff; }
  .carreras { display: grid; gap: 12px; }
  .carrera {
    border: 2px solid var(--borde); border-left: 6px solid var(--violeta);
    border-radius: 16px; padding: 16px; background: #fff;
    animation: entrar .45s ease both;
  }
  .carrera h4 { font-size: 1.08rem; line-height: 1.3; margin-bottom: 6px; }
  .etiquetas { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .etq-tag { font-size: .75rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: #f3f1ff; color: var(--violeta-oscuro); }
  .etq-tag.uni { background: #e7f0ff; color: #2d5fc4; }
  .etq-tag.dur { background: #e4f8ef; color: #1d8a63; }
  .etq-tag.sede { background: #fff1e0; color: #a35a0a; }
  .carrera p, .detalle p { font-size: .94rem; color: var(--texto-suave); }
  .afin-fila { display: flex; justify-content: space-between; font-size: .85rem; font-weight: 700; margin: 4px 0 4px; }
  .afin-barra { height: 10px; border-radius: 99px; background: #efecfb; overflow: hidden; margin-bottom: 10px; }
  .afin-barra > div { height: 100%; width: 0; border-radius: 99px; transition: width 1s cubic-bezier(.4,0,.2,1); background: linear-gradient(90deg, var(--violeta), var(--azul)); }
  details { margin-top: 8px; }
  summary { cursor: pointer; font-weight: 700; font-size: .9rem; color: var(--violeta-oscuro); padding: 4px 0; border-radius: 6px; }
  .detalle { margin-top: 6px; display: grid; gap: 8px; }
  .detalle strong { color: var(--texto); }
  .detalle a { color: var(--azul); word-break: break-all; }
  .mini { border: 2px solid var(--borde); border-radius: 14px; padding: 10px 14px; background: #fff; margin-top: 0; }
  .mini > summary { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; color: var(--texto); }
  .mini .mini-nombre { font-size: .95rem; }
  .mini .mini-nombre small { display: block; font-weight: 500; font-size: .78rem; color: var(--texto-suave); }
  .mini .mini-pct { color: var(--violeta-oscuro); white-space: nowrap; }
  .mini .afin-barra { margin-top: 10px; }
  .vacio { font-size: .92rem; color: var(--texto-suave); background: #f6f4ff; border-radius: 12px; padding: 12px 14px; }
  .areas-resumen { display: grid; gap: 8px; }
  .areas-resumen .fila { display: flex; justify-content: space-between; gap: 10px; font-size: .9rem; font-weight: 600; }
  .areas-resumen .afin-barra { margin-bottom: 4px; height: 8px; }
  .catalogo { margin-top: 8px; }
  .catalogo details { border: 2px solid var(--borde); border-radius: 14px; padding: 8px 14px; margin-bottom: 8px; }
  .catalogo ul { list-style: none; margin: 8px 0 4px; display: grid; gap: 8px; }
  .catalogo li { font-size: .9rem; }
  .catalogo li small { display: block; color: var(--texto-suave); font-size: .78rem; }
  .nota { background: #fff7e6; border: 1px solid #ffe1a8; color: #7a5a12; border-radius: 12px; padding: 12px 14px; font-size: .9rem; margin-bottom: 14px; }
  .acciones { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 26px; }
  .aviso { font-size: .8rem; color: var(--texto-suave); text-align: center; margin-top: 18px; }

  @media (min-width: 600px) {
    .tarjeta { padding: 36px 40px; }
    .nivel { min-height: 92px; }
    .nivel .etq { font-size: .8rem; }
  }
  @media (max-width: 380px) {
    .escala { gap: 5px; }
    .nivel .etq { font-size: .66rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>

  /* ---------- UTILIDADES ---------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
  function enRango(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function pendiente(txt) { return /verificar/i.test(txt || ''); }
  function fmtDur(c) { return pendiente(c.d) ? 'Duración a confirmar en el plan oficial' : c.d; }
  function fmtMod(c) { return pendiente(c.m) ? 'Modalidad a confirmar' : c.m; }
  function linksFuente(c) {
    var urls = (c.fu || '').match(/https?:\/\/[^\s)]+/g) || [];
    return urls.map(function (u) {
      return '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(u.replace(/^https?:\/\//, '').replace(/\/$/, '')) + '</a>';
    }).join('<br>');
  }

  function cambiarPantalla(render, atras) {
    var previa = tarjeta.firstElementChild;
    if (previa) previa.classList.add('saliendo');
    setTimeout(function () {
      tarjeta.innerHTML = '';
      render();
      var p = tarjeta.firstElementChild;
      if (p && atras) p.classList.add('atras');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      bloqueado = false;
    }, previa ? 180 : 0);
  }

  function totalEstimado() {
    return parte2Lista ? seq.length : P1.length + ESTIMADO_PARTE2 + P3.length;
  }
  function setProgreso(hechas, texto) {
    var total = totalEstimado();
    var pct = enRango(Math.round((hechas / total) * 100), 0, 100);
    barraRelleno.style.width = pct + '%';
    barra.setAttribute('aria-valuenow', pct);
    progTexto.textContent = texto;
    progPct.textContent = pct + '%';
  }
  function progresoPregunta() {
    var n1 = P1.length, n3 = P3.length, n2 = seq.length - n1 - n3, txt;
    if (idx < n1) txt = 'Parte 1 de 3 · pregunta ' + (idx + 1) + ' de ' + n1;
    else if (idx < n1 + n2) txt = 'Parte 2 de 3 · pregunta ' + (idx - n1 + 1) + ' de ' + n2;
    else txt = 'Parte 3 de 3 · pregunta ' + (idx - n1 - n2 + 1) + ' de ' + n3;

    html += '</div><div class="nav-pregunta"><button type="button" class="volver" id="btnVolver"' + (idx === 0 ? ' disabled' : '') + '>Anterior</button>' +
            '<span class="ayuda-teclas">Podés usar las teclas 1 a 5</span></div>';
    d.innerHTML = html;
    tarjeta.appendChild(d);
    var botones = d.querySelectorAll('.nivel');
    for (var k = 0; k < botones.length; k++) {
      botones[k].addEventListener('click', function (e) {
        responder(parseInt(e.currentTarget.getAttribute('data-v'), 10), e.currentTarget);
      });
    }
    document.getElementById('btnVolver').addEventListener('click', volver);
  }

  function responder(v, btn) {
    if (bloqueado) return;
    bloqueado = true;
    var q = seq[idx];
    respuestas[q.id] = v;
    if (btn) btn.classList.add('elegida');
    if (q.part === 1) {          // si cambia el panorama general, la parte 2 se vuelve a calcular
      seq = P1.slice();
      parte2Lista = false;
    }
    idx++;
    setTimeout(function () {
      if (idx < seq.length) {
        cambiarPantalla(mostrarPregunta, false);
      } else if (!parte2Lista) {
        enPregunta = false;
        cambiarPantalla(mostrarAreas, false);
      } else {
        enPregunta = false;
        setProgreso(seq.length, 'Listo');
        cambiarPantalla(mostrarResultado, false);
      }
    }, 220);
  }

  function volver() {
    if (bloqueado || idx === 0) return;
    bloqueado = true;
    idx--;
    cambiarPantalla(mostrarPregunta, true);
  }

  document.addEventListener('keydown', function (e) {
    if (!enPregunta || bloqueado) return;
    if (e.key >= '1' && e.key <= '5') {
      responder(parseInt(e.key, 10), tarjeta.querySelector('.nivel[data-v="' + e.key + '"]'));
    } else if (e.key === 'ArrowLeft') {
      volver();
    }
  });

  /* ---------- TRANSICIÓN: ELECCIÓN DE ÁREAS A PROFUNDIZAR ---------- */
  function mostrarAreas() {
    enPregunta = false;
    var punt = AREAS.map(function (a, i) { return { i: i, s: respuestas[P1[i].id] || 1 }; });
    punt.sort(function (a, b) { return b.s - a.s || a.i - b.i; });
    var umbral = punt[N_AREAS_EXPLORAR - 1].s;
    var fijas = punt.filter(function (p) { return p.s > umbral; });
    var empatadas = punt.filter(function (p) { return p.s === umbral; });
    var cupos = N_AREAS_EXPLORAR - fijas.length;
    var hayEleccion = empatadas.length > cupos;
    var elegidas = [];

    setProgreso(P1.length, 'Parte 1 completa');

    var d = document.createElement('div');
    d.className = 'pantalla pantalla-areas';
    var html = '<span class="seccion">Fin de la parte 1</span><h2>Estas son las áreas que más te interesaron</h2>' +
               '<p class="sub">Ahora vamos a profundizar con preguntas más específicas de estas áreas.</p><div class="area-lista">';
    fijas.forEach(function (p) {
      html += '<div class="area-fija"><span>' + esc(AREAS[p.i].n) + '</span><span class="rot">Seleccionada</span></div>';
    });
    if (!hayEleccion) {
      empatadas.forEach(function (p) {
        html += '<div class="area-fija"><span>' + esc(AREAS[p.i].n) + '</span><span class="rot">Seleccionada</span></div>';
      });
    }
    html += '</div>';
    if (hayEleccion) {
      html += '<div class="aviso-empate">Tenés ' + empatadas.length + ' áreas con el mismo puntaje. Elegí ' + cupos + (cupos === 1 ? ' que querés' : ' que querés') + ' profundizar.</div><div class="area-lista" id="listaEmpate">';
      empatadas.forEach(function (p) {
        html += '<button type="button" class="area-op" data-i="' + p.i + '"><span>' + esc(AREAS[p.i].n) + '</span><span class="tilde">Elegir</span></button>';
      });
      html += '</div>';
    }
    html += '<div class="nav-pregunta"><button type="button" class="volver" id="btnVolverAreas">Anterior</button>' +
            '<button type="button" class="btn" id="btnSeguir"' + (hayEleccion ? ' disabled' : '') + '>Continuar</button></div>';
    d.innerHTML = html;
    tarjeta.appendChild(d);

    var btnSeguir = document.getElementById('btnSeguir');
    if (hayEleccion) {
      var ops = d.querySelectorAll('.area-op');
      for (var k = 0; k < ops.length; k++) {
        ops[k].addEventListener('click', function (e) {
          var b = e.currentTarget, i = parseInt(b.getAttribute('data-i'), 10), pos = elegidas.indexOf(i);
          if (pos >= 0) { elegidas.splice(pos, 1); b.classList.remove('sel'); b.querySelector('.tilde').textContent = 'Elegir'; }
          else if (elegidas.length < cupos) { elegidas.push(i); b.classList.add('sel'); b.querySelector('.tilde').textContent = 'Elegida'; }
          btnSeguir.disabled = elegidas.length !== cupos;
        });
      }
    }
    document.getElementById('btnVolverAreas').addEventListener('click', function () {
      if (bloqueado) return;
      bloqueado = true;
      idx = P1.length - 1;
      cambiarPantalla(mostrarPregunta, true);
    });
    btnSeguir.addEventListener('click', function () {
      if (bloqueado || btnSeguir.disabled) return;
      bloqueado = true;
      var ids = fijas.map(function (p) { return p.i; });
      ids = ids.concat(hayEleccion ? elegidas : empatadas.map(function (p) { return p.i; }));
      areasElegidas = ids;
      var parte2 = [];
      ids.forEach(function (a) { parte2 = parte2.concat(ESP[a]); });
      seq = P1.concat(parte2, P3);
      parte2Lista = true;
      idx = P1.length;
      cambiarPantalla(mostrarPregunta, false);
    });
  }

  /* ---------- CÁLCULO ---------- */
  function calcular() {
    var sc = {}, mx = {};
    CARRERAS.forEach(function (c) { sc[c.mn] = 0; mx[c.mn] = 0; });
    seq.forEach(function (q) {
      var v = respuestas[q.id];
      if (!v) return;
      Object.keys(q.w).forEach(function (mn) {
        sc[mn] += (v - 1) * q.w[mn];
        mx[mn] += 4 * q.w[mn];
      });
    });
    var lista = CARRERAS.filter(function (c) { return areasElegidas.indexOf(c.a) >= 0; }).map(function (c) {
      return { c: c, pct: mx[c.mn] ? Math.round(100 * sc[c.mn] / mx[c.mn]) : 0 };
    });
    lista.sort(function (a, b) { return b.pct - a.pct || a.c.n.localeCompare(b.c.n); });

    var info = areasElegidas.map(function (a) {
      var pcts = lista.filter(function (x) { return x.c.a === a; }).map(function (x) { return x.pct; }).slice(0, 2);
      var prom = pcts.reduce(function (s, p) { return s + p; }, 0) / (pcts.length || 1);
      return { a: a, pct: Math.round(prom), p1: respuestas[P1[a].id] || 1 };
    });
    info.sort(function (x, y) { return y.pct - x.pct || y.p1 - x.p1 || x.a - y.a; });
    return { lista: lista, areas: info };
  }

  /* ---------- RENDER DE CARRERAS ---------- */
  function etiquetasHTML(c) {
    return '<div class="etiquetas"><span class="etq-tag uni">' + esc(c.u) + '</span>' +
           '<span class="etq-tag dur">' + esc(fmtDur(c)) + '</span>' +
           '<span class="etq-tag">' + esc(c.t) + '</span>' +
           '<span class="etq-tag sede">' + esc(c.s) + '</span></div>';
  }
  function fila(titulo, txt) {
    return txt ? '<p><strong>' + titulo + ':</strong> ' + esc(txt) + '</p>' : '';
  }
  function detalleHTML(c) {
    return '<div class="detalle">' +
      fila('Facultad o unidad', c.f) +
      fila('Modalidad', fmtMod(c)) +
      fila('Plan de estudios', c.plan) +
      fila('Actividades profesionales', c.act) +
      fila('Dónde se puede trabajar', c.amb) +
      fila('Habilidades e intereses', c.hab) +
      '<p><strong>Fuente oficial:</strong><br>' + linksFuente(c) + '</p>' +
      '</div>';
  }
  function barraAfin(pct) {
    return '<div class="afin-fila"><span>Afinidad con tus respuestas</span><span>' + pct + '%</span></div>' +
           '<div class="afin-barra"><div data-w="' + pct + '"></div></div>';
  }
  function cardCompleta(x, delay) {
    var c = x.c;
    return '<article class="carrera" style="animation-delay:' + delay + 's">' +
      '<h4>' + esc(c.n) + '</h4>' + etiquetasHTML(c) + barraAfin(x.pct) +
      '<p>' + esc(c.perfil) + '</p>' +
      '<details><summary>Ver más información</summary>' + detalleHTML(c) + '</details>' +
      '</article>';
  }
  function cardMini(x) {
    var c = x.c;
    return '<details class="mini"><summary><span class="mini-nombre">' + esc(c.n) +
      '<small>' + esc(c.u) + ' · ' + esc(c.s) + '</small></span><span class="mini-pct">' + x.pct + '%</span></summary>' +
      '<div class="afin-barra"><div data-w="' + x.pct + '"></div></div>' + etiquetasHTML(c) +
      '<p style="font-size:.94rem;color:var(--texto-suave)">' + esc(c.perfil) + '</p>' + detalleHTML(c) + '</details>';
  }
  function animarBarras(root) {
    setTimeout(function () {
      var bs = root.querySelectorAll('.afin-barra > div[data-w]');
      for (var i = 0; i < bs.length; i++) bs[i].style.width = bs[i].getAttribute('data-w') + '%';
    }, 120);
  }

  /* ---------- RESULTADO ---------- */
  function mostrarResultado() {
    enPregunta = false;
    var R = calcular();
    var principal = R.areas[0];
    var A = AREAS[principal.a];
    var sede = 'all';
    var maxPct = R.lista.length ? R.lista[0].pct : 0, minPct = R.lista.length ? R.lista[R.lista.length - 1].pct : 0;

    var d = document.createElement('div');
    d.className = 'pantalla';
    var html =
      '<div class="resultado-cabecera">' +
        '<div class="etiqueta">Tu área de mayor afinidad</div>' +
        '<h2>' + esc(A.n) + '</h2>' +
        '<p class="lema">' + esc(A.lema) + '</p>' +
        '<p class="mensaje">' + esc(A.msg) + '</p>' +
      '</div>';
    if (maxPct - minPct < 20) {
      html += '<div class="nota">Tus respuestas fueron muy parejas, así que el resultado es menos preciso. Si querés, repetí el test usando más los extremos de la escala (1 y 5).</div>';
    }
    html +=
      '<h3>¿En qué sede podrías estudiar?</h3>' +
      '<div class="filtros" id="filtros">' +
        '<button type="button" class="filtro activo" data-s="all">Todas las sedes</button>' +
        '<button type="button" class="filtro" data-s="res">Resistencia (Chaco)</button>' +
        '<button type="button" class="filtro" data-s="cor">Corrientes</button>' +
      '</div>' +
      '<h3>Tus carreras con mayor afinidad</h3>' +
      '<p class="sub">Ordenadas de mayor a menor afinidad con lo que respondiste, dentro de tus tres áreas de mayor interés.</p>' +
      '<div class="carreras" id="listaTop"></div>' +
      '<div id="bloqueMas"><h3>Más opciones en tus áreas de interés</h3><p class="sub">Tocá una carrera para ver su información completa.</p><div class="carreras" id="listaMas"></div></div>' +
      '<h3>Tus áreas exploradas</h3><div class="areas-resumen">';
    R.areas.forEach(function (x) {
      html += '<div><div class="fila"><span>' + esc(AREAS[x.a].n) + '</span><span>' + x.pct + '%</span></div>' +
              '<div class="afin-barra"><div data-w="' + x.pct + '"></div></div></div>';
    });
    html +=
      '</div>' +
      '<h3>Explorar todas las carreras de la zona</h3>' +
      '<p class="sub">Si querés ver otras opciones fuera de tus áreas principales, acá están las ' + CARRERAS.length + ' carreras agrupadas por área.</p>' +
      '<div class="catalogo" id="catalogo"></div>' +
      '<div class="acciones">' +
        '<button type="button" class="btn" id="btnCompartir">Compartir resultado</button>' +
        '<button type="button" class="btn secundario" id="btnRepetir">Repetir el test</button>' +
      '</div>' +
      '<p class="aviso">Este test es una guía orientativa, no un diagnóstico. Los datos de duración, sede y modalidad deben confirmarse en los sitios oficiales de cada facultad antes de decidir. Explorá otras carreras, hablá con estudiantes y profesionales y visitá las facultades. La decisión final es tuya.</p>';
      '<p class="autor">Desarrollado por Dureco Ingenieria · Carreras UNNE y UTN FRRE · Uso educativo gratuito · Prohibida su comercialización sin autorización</p>';
    d.innerHTML = html;
    tarjeta.appendChild(d);

    function sedeOk(c) {
      if (sede === 'res') return /Chaco/i.test(c.s);
      if (sede === 'cor') return /Corrientes/i.test(c.s);
      return true;
    }
    function pintar() {
      var f = R.lista.filter(function (x) { return sedeOk(x.c); });
      var top = f.slice(0, 6), mas = f.slice(6);
      var lt = d.querySelector('#listaTop'), lm = d.querySelector('#listaMas');
      lt.innerHTML = top.length ? top.map(function (x, i) { return cardCompleta(x, i * 0.08); }).join('')
                                : '<p class="vacio">No hay carreras de tus áreas de interés en esa sede. Probá con otra opción o mirá el listado completo más abajo.</p>';
      d.querySelector('#bloqueMas').style.display = mas.length ? '' : 'none';
      lm.innerHTML = mas.map(cardMini).join('');
      var cat = '';
      AREAS.forEach(function (a) {
        var cs = CARRERAS.filter(function (c) { return c.a === AREAS.indexOf(a) && sedeOk(c); });
        if (!cs.length) return;
        cat += '<details><summary>' + esc(a.n) + ' (' + cs.length + ')</summary><ul>' +
          cs.map(function (c) { return '<li>' + esc(c.n) + '<small>' + esc(c.u) + ' · ' + esc(c.s) + ' · ' + esc(fmtDur(c)) + '</small></li>'; }).join('') +
          '</ul></details>';
      });
      d.querySelector('#catalogo').innerHTML = cat || '<p class="vacio">No hay carreras en esa sede.</p>';
      animarBarras(d);
    }
    pintar();

    var fs = d.querySelectorAll('.filtro');
    for (var i = 0; i < fs.length; i++) {
      fs[i].addEventListener('click', function (e) {
        sede = e.currentTarget.getAttribute('data-s');
        for (var j = 0; j < fs.length; j++) fs[j].classList.toggle('activo', fs[j] === e.currentTarget);
        pintar();
      });
    }
    // barras dentro de desplegables: se animan al abrir
    d.addEventListener('toggle', function (ev) {
      if (ev.target && ev.target.querySelectorAll) animarBarras(ev.target);
    }, true);

    d.querySelector('#btnRepetir').addEventListener('click', function () {
      if (bloqueado) return;
      bloqueado = true;
      cambiarPantalla(mostrarBienvenida, true);
    });
    d.querySelector('#btnCompartir').addEventListener('click', function () {
      var texto = 'Hice el test vocacional. Mi área de mayor afinidad es "' + A.n + '". Carreras con más afinidad: ' +
                  R.lista.slice(0, 3).map(function (x) { return x.c.n + ' (' + x.c.u + ', ' + x.pct + '%)'; }).join('; ') + '.';
      if (navigator.share) {
        navigator.share({ title: 'Mi resultado vocacional', text: texto }).catch(function () {});
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texto).then(function () { alert('Resultado copiado. Ya podés pegarlo donde quieras.'); },
                                                  function () { window.prompt('Copiá tu resultado:', texto); });
      } else {
        window.prompt('Copiá tu resultado:', texto);
      }
    });
  }

  mostrarBienvenida();
})();
</script>
</body>
</html>
