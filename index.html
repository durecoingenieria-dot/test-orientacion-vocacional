<title>Test vocacional · Carreras UNNE y UTN FRRE</title>
<style>
  :root {
    --violeta: #7c6cf0;
    --violeta-oscuro: #5b4bd6;
    --azul: #4f8cff;
    --verde: #3ecf9b;
    --texto: #2b2745;
    --texto-suave: #6b6788;
    --borde: #e3dffa;
    --tarjeta: #ffffff;
    --sombra: 0 10px 30px rgba(91, 75, 214, .12);
    --radio: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--texto);
    line-height: 1.5;
    min-height: 100vh;
    background: linear-gradient(135deg, #f1eeff, #e6f1ff 55%, #e4f8ef);
    background-attachment: fixed;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
  }
  .app { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 16px; }

  .topbar { display: none; }
  .topbar.visible { display: block; }
  .progreso-info { display: flex; justify-content: space-between; font-size: .85rem; color: var(--texto-suave); margin-bottom: 8px; font-weight: 600; }
  .barra { height: 10px; background: rgba(124,108,240,.15); border-radius: 99px; overflow: hidden; }
  .barra > div {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--violeta), var(--azul), var(--verde));
    border-radius: 99px;
    transition: width .4s cubic-bezier(.4,0,.2,1);
  }

  .tarjeta {
    background: var(--tarjeta);
    border-radius: var(--radio);
    box-shadow: var(--sombra);
    padding: 28px 22px;
    border: 1px solid var(--borde);
  }
  .pantalla { animation: entrar .35s ease both; }
  .pantalla.atras { animation-name: entrarAtras; }
  .pantalla.saliendo { animation: salir .18s ease both; }
  @keyframes entrar { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: none; } }
  @keyframes entrarAtras { from { opacity: 0; transform: translateX(-26px); } to { opacity: 1; transform: none; } }
  @keyframes salir { to { opacity: 0; transform: translateX(-18px); } }

  .bienvenida { text-align: center; padding: 8px 0; }
  h1 { font-size: clamp(1.6rem, 5.5vw, 2.2rem); line-height: 1.2; margin: 4px 0 12px; color: var(--violeta-oscuro); }
  .bienvenida p { color: var(--texto-suave); font-size: 1.05rem; max-width: 540px; margin: 0 auto 14px; }
  .como { text-align: left; background: #f6f4ff; border-radius: 14px; padding: 14px 18px; max-width: 540px; margin: 0 auto 18px; font-size: .95rem; color: var(--texto); }
  .como strong { color: var(--violeta-oscuro); }
  .como ul { margin: 6px 0 0 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 22px; }
  .chip { background: #f3f1ff; color: var(--violeta-oscuro); border-radius: 99px; padding: 6px 14px; font-size: .85rem; font-weight: 600; }

  .btn {
    appearance: none; border: 0; cursor: pointer;
    font: inherit; font-weight: 700; font-size: 1.05rem;
    padding: 14px 28px; border-radius: 99px;
    color: #fff;
    background: linear-gradient(135deg, var(--violeta), var(--azul));
    box-shadow: 0 8px 20px rgba(91,75,214,.3);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(91,75,214,.35); }
  .btn:active { transform: translateY(0); }
  .btn.secundario { background: #fff; color: var(--violeta-oscuro); border: 2px solid var(--borde); box-shadow: none; }
  .btn.secundario:hover { border-color: var(--violeta); }
  .btn:focus-visible, .nivel:focus-visible, summary:focus-visible, .volver:focus-visible { outline: 3px solid var(--azul); outline-offset: 3px; }

  .seccion { display: inline-block; font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--violeta-oscuro); background: #f0edff; padding: 4px 12px; border-radius: 99px; margin-bottom: 14px; }
  h2 { font-size: clamp(1.2rem, 4.6vw, 1.55rem); line-height: 1.35; margin-bottom: 22px; font-weight: 650; }
  .escala { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .nivel {
    appearance: none; cursor: pointer; font: inherit; color: inherit;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px;
    background: #faf9ff; border: 2px solid var(--borde); border-radius: 14px;
    padding: 12px 4px 10px; min-height: 84px;
    transition: transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .nivel .num { font-size: 1.4rem; font-weight: 800; color: var(--violeta-oscuro); line-height: 1; }
  .nivel .etq { font-size: .72rem; line-height: 1.2; color: var(--texto-suave); font-weight: 600; text-align: center; }
  .nivel:hover { border-color: var(--violeta); background: #f3f1ff; transform: translateY(-2px); }
  .nivel.elegida { border-color: var(--violeta-oscuro); background: var(--violeta-oscuro); box-shadow: 0 6px 16px rgba(91,75,214,.3); }
  .nivel.elegida .num, .nivel.elegida .etq { color: #fff; }
  .nav-pregunta { margin-top: 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .volver { background: none; border: 0; font: inherit; font-weight: 600; color: var(--texto-suave); cursor: pointer; padding: 8px 4px; border-radius: 8px; }
  .volver:hover { color: var(--violeta-oscuro); }
  .volver[disabled] { visibility: hidden; }
  .ayuda-teclas { font-size: .78rem; color: var(--texto-suave); display: none; }
  @media (hover: hover) and (pointer: fine) { .ayuda-teclas { display: block; } }

  .resultado-cabecera { text-align: center; padding: 6px 0 18px; }
  .resultado-cabecera .etiqueta { font-size: .82rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--texto-suave); }
  .resultado-cabecera h2 { margin: 8px 0; font-size: clamp(1.5rem, 6vw, 2rem); color: var(--acento, var(--violeta-oscuro)); }
  .resultado-cabecera .lema { font-weight: 600; margin-bottom: 10px; }
  .resultado-cabecera .mensaje { color: var(--texto-suave); max-width: 580px; margin: 0 auto; }
  h3 { font-size: 1.12rem; margin: 26px 0 6px; }
  .sub { font-size: .9rem; color: var(--texto-suave); margin-bottom: 12px; }
  .carreras { display: grid; gap: 12px; }
  .carrera {
    border: 2px solid var(--borde); border-left: 6px solid var(--acento, var(--violeta));
    border-radius: 16px; padding: 16px; background: #fff;
    animation: entrar .45s ease both;
  }
  .carrera.otra { border-left-color: var(--azul); }
  .carrera h4 { font-size: 1.08rem; line-height: 1.3; margin-bottom: 6px; }
  .etiquetas { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .etq-tag { font-size: .75rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: #f3f1ff; color: var(--violeta-oscuro); }
  .etq-tag.uni { background: #e7f0ff; color: #2d5fc4; }
  .etq-tag.dur { background: #e4f8ef; color: #1d8a63; }
  .carrera p { font-size: .94rem; color: var(--texto-suave); }
  .afin-fila { display: flex; justify-content: space-between; font-size: .85rem; font-weight: 700; margin: 4px 0 4px; }
  .afin-barra { height: 10px; border-radius: 99px; background: #efecfb; overflow: hidden; margin-bottom: 10px; }
  .afin-barra > div { height: 100%; width: 0; border-radius: 99px; transition: width 1s cubic-bezier(.4,0,.2,1); }
  details { margin-top: 8px; }
  summary { cursor: pointer; font-weight: 700; font-size: .9rem; color: var(--violeta-oscuro); padding: 4px 0; border-radius: 6px; }
  details p { margin-top: 6px; }
  .ranking { display: grid; gap: 8px; margin-top: 12px; }
  .ranking .fila-nombre { display: flex; justify-content: space-between; gap: 10px; font-size: .88rem; font-weight: 600; }
  .ranking .fila-nombre span:last-child { white-space: nowrap; }
  .ranking .afin-barra { margin-bottom: 0; height: 8px; }
  .segunda { background: #f6f4ff; border-radius: 16px; padding: 14px 16px; margin-top: 18px; font-size: .95rem; }
  .segunda strong { color: var(--violeta-oscuro); }
  .nota { background: #fff7e6; border: 1px solid #ffe1a8; color: #7a5a12; border-radius: 12px; padding: 12px 14px; font-size: .9rem; margin-bottom: 14px; }
  .acciones { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 26px; }
  .aviso { font-size: .8rem; color: var(--texto-suave); text-align: center; margin-top: 18px; }
  .autor { font-size: .75rem; color: var(--texto-suave); text-align: center; margin-top: 12px; opacity: .85; }

  @media (min-width: 600px) {
    .tarjeta { padding: 36px 40px; }
    .nivel { min-height: 92px; }
    .nivel .etq { font-size: .8rem; }
  }
  @media (max-width: 380px) {
    .escala { gap: 5px; }
    .nivel .etq { font-size: .66rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>

  /* ---------- CÁLCULO ---------- */
  function calcular() {
    // Puntaje por carrera y por perfil
    var scCarrera = {}, mxCarrera = {};
    var scPerfil = {}, mxPerfil = {};
    CARRERAS.forEach(function (c) { scCarrera[c.id] = 0; mxCarrera[c.id] = 0; });
    ORDEN.forEach(function (k) { scPerfil[k] = 0; mxPerfil[k] = 0; });

    PREGUNTAS.forEach(function (q, i) {
      var v = respuestas[i]; // 1..5
      var puntos = (v - 1);  // 0..4
      q.w.forEach(function (par) {
        if (par.tipo === 'carrera') {
          if (scCarrera[par.id] !== undefined) {
            scCarrera[par.id] += puntos * par.p;
            mxCarrera[par.id] += 4 * par.p;
          }
        } else if (par.tipo === 'perfil') {
          scPerfil[par.id] += puntos * par.p;
          mxPerfil[par.id] += 4 * par.p;
        }
      });
    });

    // Bonus de perfil a las carreras de ese perfil
    CARRERAS.forEach(function (c) {
      if (mxPerfil[c.c] > 0) {
        var bonus = (scPerfil[c.c] / mxPerfil[c.c]) * 12; // hasta 12 puntos extra
        scCarrera[c.id] += bonus;
        mxCarrera[c.id] += 12;
      }
    });

    var lista = CARRERAS.map(function (c) {
      var pct = mxCarrera[c.id] ? Math.round(100 * scCarrera[c.id] / mxCarrera[c.id]) : 0;
      return { c: c, pct: pct };
    });
    lista.sort(function (a, b) { return b.pct - a.pct || a.c.n.localeCompare(b.c.n); });

    // Ranking de perfiles
    var perfilPct = {};
    ORDEN.forEach(function (k) {
      // Promedio de las 3 mejores carreras del perfil + score directo del perfil
      var pcts = lista.filter(function (x) { return x.c.c === k; }).map(function (x) { return x.pct; });
      var top3 = pcts.slice(0, 3);
      var avgTop = top3.length ? top3.reduce(function (a, b) { return a + b; }, 0) / top3.length : 0;
      var directo = mxPerfil[k] ? (100 * scPerfil[k] / mxPerfil[k]) : 0;
      perfilPct[k] = Math.round(avgTop * 0.65 + directo * 0.35);
    });
    var ranking = ORDEN.slice().sort(function (a, b) {
      return perfilPct[b] - perfilPct[a] || ORDEN.indexOf(a) - ORDEN.indexOf(b);
    });

    return { lista: lista, perfil: perfilPct, ranking: ranking };
  }

        '<button type="button" class="btn secundario" id="btnRepetir">Repetir el test</button>' +
      '</div>' +
      '<p class="aviso">Este test es una guía orientativa, no un diagnóstico. Antes de decidir, explorá también otras carreras, hablá con estudiantes y profesionales y visitá las facultades. La decisión final es tuya.</p>' +
      '<p class="autor">Desarrollado por Dureco Ingenieria · Carreras UNNE y UTN FRRE · Uso educativo gratuito · Prohibida su comercialización sin autorización</p>';

    d.innerHTML = html;
    tarjeta.appendChild(d);

    setTimeout(function () {
      var bs = d.querySelectorAll('.afin-barra > div');
      for (var i = 0; i < bs.length; i++) bs[i].style.width = bs[i].getAttribute('data-w') + '%';
    }, 150);

    var det = d.querySelectorAll('details');
    for (var j = 0; j < det.length; j++) {
      det[j].addEventListener('toggle', function (ev) {
        var bs2 = ev.currentTarget.querySelectorAll('.afin-barra > div');
        for (var k = 0; k < bs2.length; k++) bs2[k].style.width = bs2[k].getAttribute('data-w') + '%';
      });
    }

    document.getElementById('btnRepetir').addEventListener('click', function () {
      if (bloqueado) return;
      bloqueado = true;
      cambiarPantalla(mostrarBienvenida, true);
    });
    document.getElementById('btnCompartir').addEventListener('click', function () {
      var texto = 'Hice el test vocacional (UNNE / UTN FRRe). Mi perfil sugerido es "' + P.nombre + '". Carreras con más afinidad: ' +
                  r.lista.slice(0, 3).map(function (x) { return x.c.n + ' (' + x.pct + '%)'; }).join(', ') + '.';
      if (navigator.share) {
        navigator.share({ title: 'Mi resultado vocacional', text: texto }).catch(function () {});
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texto).then(function () { alert('Resultado copiado. Ya podés pegarlo donde quieras.'); },
                                                  function () { window.prompt('Copiá tu resultado:', texto); });
      } else {
        window.prompt('Copiá tu resultado:', texto);
      }
    });
  }

  mostrarBienvenida();
})();
</script>
</body>
</html>
